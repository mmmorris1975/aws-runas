version: "2"
run:
  concurrency: 4
issues:
  max-same-issues: 0
linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - funlen
    - gocognit
    - gocritic
    - gocyclo
    - godot
    - gosec
    - govet
    - ineffassign
    - noctx
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    funlen:
      lines: 75
      statements: 50
    gocognit:
      min-complexity: 15
    gocyclo:
      min-complexity: 15
    govet:
      enable:
        - shadow
    lll:
      line-length: 132
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - funlen
          - gocognit
          - gocyclo
          - unused
        path: _test\.go
      # httptest requests and throwaway listeners in the metadata server tests don't need a context
      - linters:
          - noctx
        path: metadata/.*_test\.go
      # test fixtures use fake tokens/cookies and canned responses
      - linters:
          - gosec
        path: _test\.go
        text: G101|G117|G124|G705
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
